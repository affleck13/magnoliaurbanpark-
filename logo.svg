<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="450" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#2d5a3f"/>
      <stop offset="100%" stop-color="#14291c"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTIPO: FLOR MAGNOLIA / ÁRBOL GEO-ESTILIZADO -->
  <g transform="translate(15, 10)">
    <!-- Círculo contenedor con borde dorado y fondo esmeralda -->
    <circle cx="50" cy="50" r="46" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)" />

    <!-- Petalos / Hojas estilizadas de Magnolia -->
    <!-- Petalo Central Superior -->
    <path d="M50 16 C55 32 62 46 50 78 C38 46 45 32 50 16 Z" fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Petalo Izquierdo Principal -->
    <path d="M50 78 C25 65 16 45 22 30 C35 34 45 52 50 78 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Petalo Derecho Principal -->
    <path d="M50 78 C75 65 84 45 78 30 C65 34 55 52 50 78 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Petalo Izquierdo Secundario -->
    <path d="M50 78 C15 75 14 55 30 45 C38 58 46 68 50 78 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Petalo Derecho Secundario -->
    <path d="M50 78 C85 75 86 55 70 45 C62 58 54 68 50 78 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- Tallo / Base Geométrica -->
    <path d="M48 78 L52 78 L52 88 L48 88 Z" fill="url(#goldGrad)"/>
    <circle cx="50" cy="76" r="3.5" fill="#fef08a" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <!-- MAGNOLIA -->
  <text x="130" y="62" 
        font-family="'Plus Jakarta Sans', 'Cinzel', 'Trajan Pro', 'Montserrat', sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#ffffff">MAGNOLIA</text>

  <!-- URBAN PARK -->
  <text x="133" y="88" 
        font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="9" 
        fill="url(#goldGrad)">URBAN PARK</text>

  <!-- Línea Acentuadora -->
  <line x1="133" y1="96" x2="390" y2="96" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
</svg>
